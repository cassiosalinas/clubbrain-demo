<script>
const PRODUCTS = [
  { id:'camisa1', name:'Camisa I Vasco da Gama 2026', desc:'Camisa titular preta e branca, temporada 2026.', cat:'Camisas', price:299.90 },
  { id:'camisa2', name:'Camisa II Vasco da Gama 2026', desc:'Camisa reserva, tecido leve.', cat:'Camisas', price:299.90 },
  { id:'camisaretro', name:'Camisa Retrô Cruz de Malta', desc:'Edição retrô inspirada nos uniformes históricos.', cat:'Camisas', price:329.90 },
  { id:'camisainfantil', name:'Camisa Infantil', desc:'Manto titular no tamanho infantil.', cat:'Infantil', price:159.90 },
  { id:'moletom', name:'Moletom oficial Gigante da Colina', desc:'Moletom com o escudo do clube.', cat:'Vestuário', price:169.90 },
  { id:'bone', name:'Boné oficial Cruzmaltino', desc:'Boné bordado com o escudo do clube.', cat:'Acessórios', price:89.90 },
  { id:'cachecol', name:'Cachecol oficial', desc:'Preto e branco para o dia de jogo.', cat:'Acessórios', price:44.90 },
  { id:'caneca', name:'Caneca oficial', desc:'Porcelana com o escudo do clube.', cat:'Colecionáveis', price:34.90 },
  { id:'miniatura', name:'Miniatura de São Januário', desc:'Réplica em miniatura do estádio histórico.', cat:'Colecionáveis', price:69.90 },
];
const CATS = ['Todos', 'Camisas', 'Infantil', 'Vestuário', 'Acessórios', 'Colecionáveis'];
let activeCat = 'Todos';

function iconFor(cat){
  const stroke = 'stroke="#f6f4ee" stroke-width="2.5" fill="none" stroke-linejoin="round" stroke-linecap="round"';
  if(cat === 'Camisas' || cat === 'Infantil'){
    return `<svg viewBox="0 0 100 100" ${stroke}><path d="M32 14 L16 24 L21 40 L31 35 L31 88 L69 88 L69 35 L79 40 L84 24 L68 14 L59 20 Q50 26 41 20 Z"/></svg>`;
  }
  if(cat === 'Vestuário'){
    return `<svg viewBox="0 0 100 100" ${stroke}><path d="M30 30 Q50 14 70 30 L84 38 L78 50 L70 44 L70 88 L30 88 L30 44 L22 50 L16 38 Z"/><path d="M42 28 Q50 36 58 28"/></svg>`;
  }
  if(cat === 'Acessórios'){
    return `<svg viewBox="0 0 100 100" ${stroke}><path d="M18 58 Q50 26 82 58 L82 64 Q50 52 18 64 Z"/><path d="M80 57 Q94 57 94 64 Q94 69 81 67"/><circle cx="50" cy="34" r="3" fill="#f6f4ee" stroke="none"/></svg>`;
  }
  return `<svg viewBox="0 0 100 100" ${stroke}><path d="M28 30 H62 V72 A10 10 0 0152 82 H38 A10 10 0 0128 72 Z"/><path d="M62 40 H72 A10 10 0 0172 60 H62"/></svg>`;
}

function renderTabs(){
  document.getElementById('cat-tabs').innerHTML = CATS.map(c =>
    `<button class="cat-tab ${c===activeCat?'active':''}" onclick="setActiveCat('${c}')">${c}</button>`
  ).join('');
}
function setActiveCat(c){ activeCat = c; renderTabs(); renderGrid(); }

function renderGrid(){
  const items = activeCat === 'Todos' ? PRODUCTS : PRODUCTS.filter(p => p.cat === activeCat);
  document.getElementById('product-grid').innerHTML = items.map(p => `
    <div class="product-card">
      <div class="product-thumb">${iconFor(p.cat)}</div>
      <div class="product-body">
        <div class="product-cat">${p.cat}</div>
        <div class="product-name">${p.name}</div>
        <div class="product-price">R$ ${p.price.toFixed(2).replace('.', ',')}</div>
        <button class="product-buy" onclick="comprar('${p.id}', this)">Comprar</button>
      </div>
    </div>`).join('');
}

async function comprar(productId, btn){
  const email = currentFan && currentFan.found ? currentFan.email : (document.getElementById('login-email')?.value || '').trim();
  if(!email || !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)){
    alert('Faça login com seu e-mail de torcedor primeiro (barra no topo da página).');
    return;
  }
  btn.disabled = true;
  const original = btn.textContent;
  btn.textContent = 'Abrindo…';
  try{
    const r = await fetch('/.netlify/functions/stripe-checkout', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ type: 'produto', id: productId, fanEmail: email }),
    });
    const d = await r.json();
    if(!r.ok || !d.ok) throw new Error(d.error || 'Não foi possível iniciar o checkout.');
    window.location.href = d.url;
  }catch(e){
    alert(e.message);
    btn.disabled = false;
    btn.textContent = original;
  }
}

renderTabs();
renderGrid();
initFanLogin();
</script>
