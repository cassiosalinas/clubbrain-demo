.app{display:grid;grid-template-columns:250px 1fr;height:100vh}

.nav{flex:1;overflow:auto;padding:0 12px 12px}
.nav h6{font-size:10.5px;letter-spacing:.1em;color:var(--mut2);text-transform:uppercase;margin:16px 10px 6px;font-weight:600}

.user{border-top:1px solid var(--line);padding:14px 18px;display:flex;align-items:center;gap:10px}

.card h3 .r{margin-left:auto}
.card .sub{color:var(--mut);font-size:12px;margin-bottom:12px}
.kpi .top{display:flex;align-items:center;gap:10px;color:#c5cbe0;font-size:13px}

.sugs{display:flex;flex-wrap:wrap;gap:6px;padding:0 16px 10px}

.ask{display:flex;gap:8px;padding:12px 16px;border-top:1px solid var(--line)}

.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%) translateY(20px);opacity:0;background:#1d2a4f;border:1px solid var(--pur);padding:10px 16px;border-radius:12px;font-size:13px;z-index:60;transition:.3s;pointer-events:none}

.mut{color:var(--mut)}
@keyframes in{from{opacity:0;transform:translateY(-4px)}to{opacity:1}}
.embed .app{grid-template-columns:1fr}.embed .side,.embed .hdr{display:none}
@media (max-width:1200px){.g4{grid-template-columns:1fr 1fr}.g3,.g21,.g12{grid-template-columns:1fr}}
</style>
</head>

function spark(vals,col){const w=240,h=36,mx=Math.max(...vals),mn=Math.min(...vals);const pts=vals.map((v,i)=>[i/(vals.length-1)*w,h-4-(v-mn)/(mx-mn||1)*(h-10)]);const d=pts.map((p,i)=>(i?"L":"M")+p[0].toFixed(1)+","+p[1].toFixed(1)).join("");return`<svg class="spark" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none"><path d="${d}L${w},${h}L0,${h}Z" fill="${col}" opacity=".18"/><path d="${d}" fill="none" stroke="${col}" stroke-width="2"/></svg>`}

function donut(parts,center,sub){let a=-Math.PI/2;const R=62,r=44,cx=75,cy=75;const segs=parts.map(([n,c,p])=>{const a2=a+p*2*Math.PI;const L=p>.5?1:0;const P=(ang,rad)=>[cx+rad*Math.cos(ang),cy+rad*Math.sin(ang)];const[x1,y1]=P(a,R),[x2,y2]=P(a2,R),[x3,y3]=P(a2,r),[x4,y4]=P(a,r);const d=`M${x1},${y1}A${R},${R} 0 ${L} 1 ${x2},${y2}L${x3},${y3}A${r},${r} 0 ${L} 0 ${x4},${y4}Z`;a=a2;return`<path d="${d}" fill="${c}"/>`}).join("");return`<div class="donut"><svg width="150" height="150">${segs}</svg><div class="c"><b>${center}</b><small>${sub}</small></div></div>`}
