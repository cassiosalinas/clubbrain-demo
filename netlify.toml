[build]
  publish = "."
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"

# Garante que /.netlify/functions/chat responda mesmo com trailing slash
[[redirects]]
  from = "/api/chat"
  to = "/.netlify/functions/chat"
  status = 200

# URLs limpas da jornada do torcedor (ShopVasco / Sócio Torcedor) — servem
# os arquivos .html reais de dentro de vasco/ sem expor a extensão.
[[redirects]]
  from = "/vasco/loja"
  to = "/vasco/loja.html"
  status = 200
[[redirects]]
  from = "/vasco/socio"
  to = "/vasco/socio.html"
  status = 200
[[redirects]]
  from = "/vasco/sucesso"
  to = "/vasco/sucesso.html"
  status = 200
[[redirects]]
  from = "/vasco/virtual"
  to = "/vasco/virtual.html"
  status = 200

# Painel interno completo (Cockpit, CDP, Ontologia, Agentes de IA — o mesmo
# index.html de sempre) também acessível dentro da família de URLs do Vasco.
# "OS" = Operating System, ecoando o próprio posicionamento do produto
# (ClubBrain como "sistema operacional" de IA do clube).
[[redirects]]
  from = "/vasco/os"
  to = "/index.html"
  status = 200

# Grupo Bandeirantes (tenant de mídia): /band/os abre o mesmo painel já com
# a Band selecionada, como /vasco/os faz com o Vasco. As páginas da Band
# (Band Playverse, BandBrain OS e demos de propriedade) são arquivos estáticos
# em band/apps/ e aparecem embutidas no painel.
[[redirects]]
  from = "/band/os"
  to = "/index.html"
  status = 200

# Site do fã da Band (equivalente a /vasco/socio, /vasco/virtual, /vasco/loja e
# /vasco/sucesso). Checkout, CRM e Minu simulados: contas reais do Vasco não
# são usadas aqui.
# Site do Fã: acesso do torcedor em formato de celular, separado do painel interno.
[[redirects]]
  from = "/band/fan"
  to = "/band/fan.html"
  status = 200
[[redirects]]
  from = "/band/pass"
  to = "/band/pass.html"
  status = 200
[[redirects]]
  from = "/band/historia-viva"
  to = "/band/historia-viva.html"
  status = 200
[[redirects]]
  from = "/band/loja"
  to = "/band/loja.html"
  status = 200
[[redirects]]
  from = "/band/sucesso"
  to = "/band/sucesso.html"
  status = 200

# O backend (mvp-vasco/) vive neste repo mas NAO faz parte do site. Como o
# publish e a raiz ("."), sem esta regra o Netlify serviria o codigo-fonte do
# backend como arquivo estatico em /mvp-vasco/... — force = true e necessario
# porque, por padrao, arquivo existente tem precedencia sobre redirect.
[[redirects]]
  from = "/mvp-vasco/*"
  to = "/404.html"
  status = 404
  force = true
